name: Code health (reusable)

# Callable from any repository:
#
#   jobs:
#     code-health:
#       permissions:
#         contents: read
#         actions: read          # the previous run's baseline artifact
#         pull-requests: read    # provenance labels
#       uses: ieepirzy/mira-vitals/.github/workflows/measure.yml@<commit-sha>
#       with:
#         gate: true
#       secrets:
#         OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
#         CODE_HEALTH_TOKEN: ${{ secrets.CODE_HEALTH_TOKEN }}
#
# A commit SHA, not `@main`: `uses:` on a mutable ref executes whatever that
# branch holds at run time, inside the consumer's runner and with the
# consumer's credentials, so a change here would take effect there with no
# reviewed change there. It is also the same argument that pins the collector
# package below -- a moving reference means two runs can execute materially
# different measurement code with nothing in the snapshot to explain the shift.
#
# Named secrets, not `secrets: inherit`: `inherit` forwards every secret the
# calling repository holds across a repository boundary. This workflow declares
# exactly the two above, both optional, and needs nothing else.
#
# The `permissions:` block is not optional either. A called workflow's jobs
# cannot request more than the calling job holds, and exceeding it fails the
# run before any job starts -- `startup_failure`, with no log to read.
#
# A reusable workflow shares the caller's workflow run, so it can download an
# artifact the caller's own test job published in that same run. That is what
# lets the snapshot describe the execution which actually gated the build
# rather than a second one this job started for itself.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Interpreter used to run the analyzers."
        type: string
        default: "3.12"
      project-install:
        description: "How to install the analyzed project itself so the type checker resolves its imports, e.g. '-e .[dev]' or '-r requirements.txt'. Without it the error count is dominated by unresolved imports and is not comparable with a run that has them."
        type: string
        default: ""
      install-from-checkout:
        description: "Install the collector from this checkout rather than from PyPI. For this repository's own CI, where installing from PyPI would be circular."
        type: boolean
        default: false
      reports-artifact:
        description: "Artifact holding junit.xml and coverage.xml from the gating test job. Omitted means tests are recorded as skipped."
        type: string
        default: ""
      tests-python-version:
        description: "Interpreter that produced those reports. Recorded, because coverage differs between interpreters."
        type: string
        default: ""
      gate:
        description: "Apply blocking quality gates."
        type: boolean
        default: false
      default-branch:
        type: string
        default: "main"
      collector-requirement:
        description: >-
          The full pip requirement for the collector, extras included. A
          complete requirement rather than a bare version because a PEP 508 URL
          spec puts its extras before the `@`, which a
          "{version}[analyzers,otel]" template cannot express.
          Upgrading is a deliberate act; it shows in the series as a step
          change, with the new analyzer versions recorded beside it.
        type: string
        # Installed from git rather than PyPI: the package is not published
        # yet, and the repository is public so this needs no credential.
        #
        # Pinned to an immutable commit, not `@main`. Pinning the analyzers is
        # not sufficient: the collector itself computes the function set, the
        # percentiles, the aggregates and the deltas, so a change to
        # normalization or export shifts every consumer's numbers with nothing
        # in the snapshot to explain it. A moving ref would mean two runs
        # executing materially different code, which is precisely the silent
        # redefinition this package exists to prevent.
        #
        # Bumping this is the deliberate upgrade act: it appears in the series
        # as a step change, and because `generated_by.revision` records the
        # resolved commit, a delta across the bump is marked `incomparable`
        # rather than presented as a movement.
        #
        # The pin necessarily trails `main` by at least one commit: a workflow
        # cannot name the commit that contains it. That is fine as a steady
        # state -- it means consumers run the previous reviewed revision --
        # but it is a trap when the *point* of a change is something the pin
        # must carry. The first version of this pin named the commit before
        # `generated_by.revision` existed, so every consumer produced
        # snapshots that could not say which collector had made them, which
        # is precisely the defect the pin was introduced to fix. It went
        # unnoticed because this repository's own CI sets
        # `install-from-checkout` and so never exercises this path; the step
        # below now fails the run if a future pin regresses the same way.
        #
        # FOLLOW-UP once v0.1.0 is on PyPI: change to
        # "mira-vitals[analyzers,otel]" and have consumers reference
        # `measure.yml@v0.1.0`. Consumers never name the install source -- it
        # lives here -- so that is a one-line change in one repository, not nine.
        default: "mira-vitals[analyzers,otel] @ git+https://github.com/ieepirzy/mira-vitals@ca82e5f0bfd3da46d9794a0dfb45df5d1fa49c81"
      runner:
        description: >-
          The runner, as JSON, because `runs-on` takes either a single label
          or a list and a workflow input can only be a string: '"ubuntu-latest"'
          or '["self-hosted","some-label"]'. JSON always, rather than guessing
          from the shape of a bare string, so there is no case where the
          expression has to be evaluated to find out whether it parses.

          Not merely a convenience: a repository whose account has exhausted
          its included hosted minutes never gets a hosted runner assigned at
          all -- the job is not slow, it is never scheduled -- so for those,
          naming their own runner is the difference between this lane
          existing and not.
        type: string
        default: '"ubuntu-latest"'
      setup-python:
        description: >-
          Whether to install the interpreter with actions/setup-python. Turn
          it off for a runner the action has no prebuilt interpreter for --
          Arch, Alpine, anything not on its support matrix -- where the step
          fails outright and the runner's own Python is what you want. When
          off, `python-version` describes nothing and is not applied; the
          interpreter already on PATH is used and recorded in the snapshot,
          which is why the snapshot records it rather than assuming it.
        type: boolean
        default: true
      pip-args:
        description: >-
          Extra arguments for every pip install here, e.g.
          `--break-system-packages` on a distribution whose system Python is
          marked externally managed (PEP 668). Applied to the collector, the
          analyzers and the project's own dependencies alike, so that one
          setting cannot leave the three installed by different rules.
        type: string
        default: ""
    secrets:
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false
      CODE_HEALTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  measure:
    name: Analyze and export
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge base against the default branch is needed to describe a
          # pull request's change; a shallow clone does not contain it.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        if: inputs.setup-python
        with:
          python-version: ${{ inputs.python-version }}

      # A non-root pip on a runner without a virtualenv installs console
      # scripts under ~/.local/bin, which is not on PATH by default -- the
      # collector then installs successfully and is not found. Unconditional
      # because it is inert where the directory does not exist or is already
      # on PATH, and a conditional here would be one more thing to get wrong
      # per runner.
      - name: Make user-installed console scripts reachable
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the collector and its analyzers
        run: |
          set -euo pipefail
          PIP_EXTRA=(${{ inputs.pip-args }})
          if [ "${{ inputs.install-from-checkout }}" = "true" ]; then
            pip install "${PIP_EXTRA[@]}" -e ".[analyzers,otel]"
          else
            pip install "${PIP_EXTRA[@]}" "${{ inputs.collector-requirement }}"
          fi
          # The analyzed project's own dependencies. Without them the type
          # checker's error count is dominated by unresolved imports and is not
          # comparable with a run that has them.
          if [ -n "${{ inputs.project-install }}" ]; then
            pip install "${PIP_EXTRA[@]}" ${{ inputs.project-install }}
          fi

      - name: Fetch the reports the gating test run produced
        if: inputs.reports-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reports-artifact }}
          path: reports

      # Resolved through the REST API with Python rather than `gh`. The GitHub
      # CLI is present on hosted runners and absent from most self-hosted
      # ones, and the failure was silent in the worst possible way: `gh` not
      # found made the lookup fail, `|| true` swallowed it, the empty result
      # was reported as "no previous successful run", and every snapshot from
      # that runner would have carried `deltas: unavailable` forever while
      # claiming the baseline simply did not exist.
      #
      # That is exactly the confusion this collector exists to prevent -- a
      # failed measurement presented as a measured absence -- so the two are
      # now distinguished: no previous run is reported and succeeds, while a
      # lookup that could not be performed fails the step. The step stays
      # `continue-on-error`, because a missing baseline must never block the
      # analysis, but a failed lookup is now visible rather than mute.
      #
      # Python, not curl: the interpreter is guaranteed here (the collector
      # runs on it, and it was installed two steps ago) and curl is not.
      - name: Resolve the previous default-branch run
        id: baseline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          url = (
              f"{api}/repos/{repo}/actions/runs"
              f"?branch={os.environ['DEFAULT_BRANCH']}&status=success&per_page=1"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs") or []
          except (urllib.error.URLError, OSError, ValueError) as exc:
              # Not "no baseline" -- "could not find out". Distinct on purpose.
              sys.exit(f"baseline lookup failed ({exc}); deltas will be unavailable")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              if runs:
                  handle.write(f"run_id={runs[0]['id']}\n")
                  print(f"baseline run: {runs[0]['id']}")
              else:
                  print("no previous successful default-branch run; deltas will be unavailable")
          PY

      # `run-id` plus a token downloads from a *different* run, which is what
      # makes the baseline reachable without the GitHub CLI. Skipped rather
      # than attempted when there is no run to download from, so "no baseline
      # yet" does not surface as a failed step.
      - name: Fetch the previous default-branch snapshot as a baseline
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: code-health-main
          path: baseline
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Analyze, report and export
        env:
          # Standard OpenTelemetry configuration only. The Collector decides
          # where anything goes; CI does not know the backends.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          CODE_HEALTH_ENDPOINT: ${{ vars.CODE_HEALTH_ENDPOINT }}
          CODE_HEALTH_TOKEN: ${{ secrets.CODE_HEALTH_TOKEN }}
          MIRA_VITALS_DEFAULT_BRANCH: ${{ inputs.default-branch }}
          CODE_HEALTH_DEFAULT_BRANCH: ${{ inputs.default-branch }}
          # Provenance: explicit metadata only. Labels are trusted because
          # applying one requires write access.
          MIRA_VITALS_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--output code-health.json --emit-otlp --emit-http)
          [ -f reports/junit.xml ]    && args+=(--junit reports/junit.xml)
          [ -f reports/coverage.xml ] && args+=(--coverage reports/coverage.xml)
          [ -n "${{ inputs.tests-python-version }}" ] && \
            args+=(--tests-python-version "${{ inputs.tests-python-version }}")
          [ -f baseline/code-health.json ] && args+=(--baseline baseline/code-health.json)
          [ "${{ inputs.gate }}" = "true" ] && args+=(--gate)
          mira-vitals "${args[@]}"

      # A snapshot that cannot say which collector produced it is not a
      # measurement, it is an anecdote: the collector computes the function
      # set, the percentiles and the aggregates, so without its revision there
      # is no way to tell a real movement from a change in how the number is
      # defined. `generated_by.revision` comes from PEP 610 `direct_url.json`,
      # which pip writes only for a VCS or URL install -- so this is asserted
      # exactly when the collector was installed from the pin, and skipped for
      # `install-from-checkout`, where an editable install has no such record
      # and a null revision is the honest answer.
      - name: Verify the collector identified itself
        if: success() && !inputs.install-from-checkout
        run: |
          python - <<'PY'
          import json, sys
          snapshot = json.load(open("code-health.json"))
          identity = snapshot.get("generated_by") or {}
          revision = identity.get("revision")
          if not revision:
              sys.exit(
                  "code-health: the collector did not record its own revision "
                  f"(generated_by={identity!r}). The pinned collector-requirement "
                  "resolves to a revision that predates collector_identity(); "
                  "advance it to one that carries it."
              )
          print(f"collector: {identity.get('name')} {identity.get('version')} @ {revision}")
          PY

      # Always uploaded, including when the gate failed: the measurement of a
      # failing commit is exactly as valuable as that of a passing one.
      - name: Upload the canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-health-${{ github.ref_name == inputs.default-branch && 'main' || format('pr-{0}', github.run_id) }}
          path: code-health.json
          retention-days: 90
