name: mira-vitals CI health
description: >-
  Measure a CI job -- queue wait, wall time, steps, phases, per-test
  durations, cache outcomes, runner CPU and memory -- write ci-health.json and
  export it over OTLP. Never fails the build.

# Usage, in any job (GitHub Actions, or Forgejo Actions with the full URL
# `https://github.com/ieepirzy/mira-vitals/.github/actions/ci-health@<sha>`):
#
#   permissions:
#     contents: read
#     actions: read            # the platform adapter reads this run's jobs
#     pull-requests: read      # default-branch runs: which PR a commit merged
#                              # (the escape join); without it, a warning
#   steps:
#     - uses: ieepirzy/mira-vitals/.github/actions/ci-health@<sha>
#       with: { mode: start }  # first step: the clock and a resource baseline
#     ...
#     - run: mira-vitals ci mark install || true     # optional phase marks
#     ...
#     - uses: ieepirzy/mira-vitals/.github/actions/ci-health@<sha>
#       if: always()
#       with:
#         junit: reports/junit.xml
#         caches: uv=${{ steps.uv.outputs.cache-hit }}
#         outcome: ${{ job.status }}
#       env:
#         OTEL_EXPORTER_OTLP_ENDPOINT: ${{ github.event_name == 'push' && secrets.CODE_HEALTH_TOKEN && 'https://collector.example' || '' }}
#         OTEL_EXPORTER_OTLP_HEADERS: ${{ github.event_name == 'push' && format('Authorization=Bearer%20{0}', secrets.CODE_HEALTH_TOKEN) || '' }}
#
# Pin by commit SHA, as for measure.yml. The code that runs is this action's
# own checkout (`github.action_path`), so the pin covers the code that
# measures, with no second version to keep in step and nothing to install.
#
# Every step below ends in `exit 0` or `continue-on-error`: a missing Python,
# a failed install or an unreachable endpoint becomes a warning, never a red
# job. The `mira-vitals` command is put on PATH through a directory holding
# only that one link -- never the venv's bin, whose `python` and `pip` would
# shadow the job's own for every later step.

inputs:
  mode:
    description: "start (first step) or report (last step, with if: always())."
    default: report
  junit:
    description: "JUnit XML paths or globs, separated by spaces or newlines."
    default: ""
  caches:
    description: "Cache outcomes as name=hit pairs, comma-separated, e.g. uv=true,npm=false. Empty values are ignored."
    default: ""
  outcome:
    # Never write an expression in a description: GitHub evaluates them when
    # it loads this file, and `job` is not available there, so the action
    # would fail to load and fail the job (tests/test_ci_health.py checks).
    description: "The job's status so far: pass the job context's status."
    default: ""
  work:
    description: "Explicit work outcomes as category=outcome pairs, comma-separated. Omit when unknown."
    default: ""
  tests-complete:
    description: "Set true only when all intended test lanes finished and their JUnit reports were collected. This is a caller attestation."
    default: "false"
  output:
    description: "Where the ci-health.json document is written."
    default: ci-health.json
  token:
    description: "Token for the platform adapter (needs actions: read). Empty skips it."
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Nothing is installed. The `ci` command is stdlib-only, so it runs
    # straight from this action's own checkout (PYTHONPATH=<checkout>/src):
    # no venv, no pip, no package index. A venv was the first design, and on
    # ARC's runner image it failed: python3.12 is there, ensurepip is not
    # (Debian splits it into python3-venv).
    #
    # Bounded: every external program runs under `timeout`, and no step
    # downloads anything. A runner with no Python >= 3.11 (and no uv that
    # already has one) is not measured, with a warning; the earlier fallback
    # that installed uv and a Python had no time bound.
    - id: probe
      shell: bash
      run: |
        set +e
        dir="${RUNNER_TEMP:-/tmp}/mira-vitals-ci"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        if [ -x "$dir/bin/mira-vitals" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        py=""
        for c in python3.14 python3.13 python3.12 python3.11 python3; do
          p="$(command -v "$c" 2>/dev/null)"
          if [ -n "$p" ] && timeout 10 "$p" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)' >/dev/null 2>&1; then
            py="$p"; break
          fi
        done
        if [ -z "$py" ] && command -v uv >/dev/null 2>&1; then
          # Only an interpreter uv already has: `find`, never `install`.
          py="$(timeout 20 uv python find '>=3.11' 2>/dev/null)"
        fi
        echo "python=$py" >> "$GITHUB_OUTPUT"
        exit 0

    - shell: bash
      env:
        MV_DIR: ${{ steps.probe.outputs.dir }}
        MV_PY: ${{ steps.probe.outputs.python }}
        MV_READY: ${{ steps.probe.outputs.ready }}
        MV_SRC: ${{ github.action_path }}/../../../src
      run: |
        set +e
        if [ "$MV_READY" != "true" ]; then
          src="$(cd "$MV_SRC" 2>/dev/null && pwd)"
          if [ -n "$MV_PY" ] && [ -n "$src" ] && [ -f "$src/mira_vitals/ci/command.py" ]; then
            mkdir -p "$MV_DIR/bin"
            # Only this one wrapper goes on PATH, never an interpreter's bin
            # directory, so the job's own python/pip are never shadowed.
            # -P: the working directory (the checked-out repository, which
            # this step runs in with GITHUB_TOKEN and the ingest token) is
            # NOT put on sys.path, so a repo-root json.py or http.py cannot
            # shadow the standard library. PYTHONPATH still applies.
            # `timeout`: the Python side has its own deadline too; this is
            # the outer bound if the interpreter itself hangs.
            printf '#!/usr/bin/env bash\nPYTHONPATH=%q exec timeout 120 %q -P -m mira_vitals "$@"\n' "$src" "$MV_PY" > "$MV_DIR/bin/mira-vitals"
            chmod +x "$MV_DIR/bin/mira-vitals"
          else
            echo "::warning title=mira-vitals ci::no Python >= 3.11 found; this job is not measured"
          fi
        fi
        [ -x "$MV_DIR/bin/mira-vitals" ] && echo "$MV_DIR/bin" >> "$GITHUB_PATH"
        exit 0

    - shell: bash
      env:
        MV_DIR: ${{ steps.probe.outputs.dir }}
        MV_MODE: ${{ inputs.mode }}
        MV_JUNIT: ${{ inputs.junit }}
        MV_CACHES: ${{ inputs.caches }}
        MV_OUTCOME: ${{ inputs.outcome }}
        MV_WORK: ${{ inputs.work }}
        MV_TESTS_COMPLETE: ${{ inputs.tests-complete }}
        MV_OUTPUT: ${{ inputs.output }}
        GITHUB_TOKEN: ${{ inputs.token }}
        MIRA_VITALS_CI_REVISION: ${{ github.action_ref }}
      run: |
        set +e
        bin="$MV_DIR/bin/mira-vitals"
        [ -x "$bin" ] || exit 0
        if [ "$MV_MODE" = "start" ]; then
          "$bin" ci start
          exit 0
        fi
        args=(ci report --output "$MV_OUTPUT")
        # No shell globbing: patterns go to mira-vitals as written, which
        # expands them itself (a pattern matching thousands of files must not
        # become thousands of arguments).
        set -f
        for pattern in $MV_JUNIT; do args+=(--junit "$pattern"); done
        set +f
        [ -n "$MV_CACHES" ] && args+=(--cache "$MV_CACHES")
        [ -n "$MV_OUTCOME" ] && args+=(--outcome "$MV_OUTCOME")
        IFS=',' read -r -a work_items <<< "$MV_WORK"
        for item in "${work_items[@]}"; do
          item="${item//[[:space:]]/}"
          [ -n "$item" ] && args+=(--work "$item")
        done
        [ "$MV_TESTS_COMPLETE" = "true" ] && args+=(--tests-complete)
        "$bin" "${args[@]}"
        exit 0
